; LawnBot CrowPanel ESP32 Display — PlatformIO Project
; Board: ELECROW DIS08070H (ESP32-S3-WROOM-1-N4R8, 800x480 RGB LCD, GT911 touch)

[platformio]
src_dir    = src
boards_dir = .

[env:crowpanel-7inch]
; Known-good production baseline. espressif32 5.4.0 currently resolves to
; Arduino-ESP32 2.0.6 in PlatformIO; keep dependency experiments isolated.
platform         = espressif32@5.4.0
board            = esp32-s3-devkitc-1-n8-elecrow
framework        = arduino

build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE          ; LVGL finds include/lv_conf.h via -I include
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1              ; ESP32-S3 native USB CDC
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_build.partitions = partitions.csv

lib_deps =
    lvgl/lvgl                @ ^8.4.0
    ; Known-good display-driver baseline. Test upgrades in the next env below;
    ; do not turn a dependency experiment into a surprise field deployment.
    lovyan03/LovyanGFX       @ 1.1.16
    tamctec/TAMC_GT911       @ ^1.0.2
    links2004/WebSockets     @ ^2.4.1
    bblanchon/ArduinoJson    @ ^7.0.4
    ayushsharma82/ElegantOTA @ ^2.2.9

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
upload_speed   = 921600

; ── OTA upload target ───────────────────────────────────────────────────
; Use this env to flash over WiFi once the device is running on the network.
;   pio run -e crowpanel-7inch-ota --target upload
[env:crowpanel-7inch-ota]
extends         = env:crowpanel-7inch
upload_protocol = espota
upload_port     = ${sysenv.CROWPANEL_OTA_HOST}
upload_flags    =
    --port=3232
    --auth=${sysenv.CROWPANEL_OTA_PASSWORD}

; Deterministic safe-default build for CI and UI/demo testing. The guard keeps
; an ignored developer config_private.h from silently changing CI semantics.
[env:crowpanel-7inch-demo]
extends = env:crowpanel-7inch
build_flags =
    ${env:crowpanel-7inch.build_flags}
    -D LAWNBOT_SKIP_PRIVATE_CONFIG=1

; Credential-free LIVE compile for CI. This exercises the networking, control,
; OTA and diagnostic code paths but is never suitable for device deployment.
[env:crowpanel-7inch-live-ci]
extends = env:crowpanel-7inch
build_flags =
    ${env:crowpanel-7inch.build_flags}
    -D LAWNBOT_SKIP_PRIVATE_CONFIG=1
    -D APP_MODE=APP_MODE_LIVE
    -D ENABLE_SCREENSHOT_HTTP=1

; Staged framework experiment. This is build/test-only until hardware smoke,
; OTA rollback, touch, DMA and screenshot capture have all been verified.
[env:crowpanel-7inch-platform-next]
extends  = env:crowpanel-7inch-demo
platform = espressif32@7.0.1

; Staged display-library experiment on the known-good framework, deliberately
; isolated so regressions have somewhere specific to confess their sins.
[env:crowpanel-7inch-lovyangfx-next]
extends  = env:crowpanel-7inch-demo
lib_deps =
    lvgl/lvgl                @ 8.4.0
    lovyan03/LovyanGFX       @ 1.2.25
    tamctec/TAMC_GT911       @ ^1.0.2
    links2004/WebSockets     @ ^2.4.1
    bblanchon/ArduinoJson    @ ^7.0.4
    ayushsharma82/ElegantOTA @ ^2.2.9

; Combined framework + display-library candidate. Promote each isolated stage
; only after hardware smoke tests, then validate this combination separately.
[env:crowpanel-7inch-combined-next]
extends  = env:crowpanel-7inch-lovyangfx-next
platform = espressif32@7.0.1
